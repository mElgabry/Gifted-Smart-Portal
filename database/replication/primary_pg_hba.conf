# =============================================================================
# بوابة الإدارة العامة للموهوبين والتعلم الذكي
# قواعد التحقق والاتصال (pg_hba.conf) للخادم الرئيسي (Primary Server)
# =============================================================================
# TYPE  DATABASE        USER            ADDRESS                 METHOD

local   all             postgres                                peer
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256

# السماح لخادم التطبيق بالاتصال بقاعدة البيانات
host    gifted_portal_db portal_admin   192.168.10.0/24         scram-sha-256

# السماح للخادم الاحتياطي (Standby Server: 192.168.10.20) بسحب تدفق WAL (Streaming Replication)
host    replication     repuser         192.168.10.20/32        scram-sha-256
