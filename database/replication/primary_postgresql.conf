# =============================================================================
# بوابة الإدارة العامة للموهوبين والتعلم الذكي
# إعدادات الخادم الرئيسي (Primary Server) لـ PostgreSQL Streaming Replication
# تضاف هذه الإعدادات إلى نهاية ملف postgresql.conf في الخادم الرئيسي (192.168.10.10)
# =============================================================================

listen_addresses = '*'
port = 5432
max_connections = 200

shared_buffers = 2GB
effective_cache_size = 6GB
work_mem = 32MB
maintenance_work_mem = 512MB

wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
wal_keep_size = 2048MB
wal_compression = on

archive_mode = on
archive_command = 'test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f'

hot_standby = on
hot_standby_feedback = on
